name: Shell quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Bash syntax
        run: bash -n newworld-manager.sh
      - name: ShellCheck
        run: shellcheck -S style newworld-manager.sh tests/smoke.sh tests/vmess-integration.sh tests/vless-integration.sh
      - name: Smoke tests
        run: bash tests/smoke.sh
      - name: VMess integration tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tests/vmess-integration.sh
      - name: VLESS integration tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tests/vless-integration.sh
